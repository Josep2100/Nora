name: Main Config
version: 1.0.0
schema: v1
models:
  - name: DeepSeek R1 (Local - Ilimitado)
    provider: ollama
    model: deepseek-r1:7b
    roles:
      - chat
      - edit
      - apply

  - name: Gemini 1.5 Flash (Gratis)
    provider: gemini
    model: gemini-1.5-flash
    apiKey: TU_API_KEY_DE_GEMINI
    roles:
      - chat
      - edit
      - apply

  - name: Qwen2.5-Coder 1.5B
    provider: ollama
    model: qwen2.5-coder:1.5b-base
    roles:
      - autocomplete

  - name: Nomic Embed
    provider: ollama
    model: nomic-embed-text:latest
    roles:
      - embed