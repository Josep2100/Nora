<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nora">
  <defs>
    <linearGradient id="bg" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0" stop-color="#1b1230"/>
      <stop offset="0.55" stop-color="#21153b"/>
      <stop offset="1" stop-color="#0b0814"/>
    </linearGradient>
    <linearGradient id="ring" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0" stop-color="#d95ad0"/>
      <stop offset="0.5" stop-color="#914fff"/>
      <stop offset="1" stop-color="#39bce7"/>
    </linearGradient>
    <linearGradient id="n" x1="15%" y1="0%" x2="90%" y2="100%">
      <stop offset="0" stop-color="#f36bd4"/>
      <stop offset="0.48" stop-color="#b956ef"/>
      <stop offset="1" stop-color="#7b5df4"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="12" y="12" width="488" height="488" rx="128" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="126" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>

  <circle cx="256" cy="256" r="178" fill="none" stroke="url(#ring)" stroke-opacity=".25" stroke-width="7"/>
  <circle cx="256" cy="256" r="151" fill="#9b5cff" opacity=".075" filter="url(#softGlow)"/>

  <!-- Nora monogram: deliberately simple and legible at favicon size -->
  <path d="M158 354V158h54l88 126V158h54v196h-54l-88-126v126z" fill="url(#n)"/>

  <!-- Signature sparkle -->
  <path d="M375 105c3 22 10 29 32 32-22 3-29 10-32 32-3-22-10-29-32-32 22-3 29-10 32-32z"
        fill="#fff" filter="url(#smallGlow)"/>
  <circle cx="393" cy="89" r="5" fill="#fff" opacity=".75"/>
</svg>
